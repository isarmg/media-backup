<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>照片备份</title>
  <link rel="stylesheet" href="/admin/sarmg-design.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main id="loginWrap" class="app-shell sarmg-theme sarmg-login" data-sarmg-scope data-sarmg-theme="light">
    <form id="loginForm" class="sarmg-card sarmg-login__card" aria-label="登录照片备份管理中心">
      <div class="sarmg-card__inner">
        <div class="sarmg-card__row"><span class="sarmg-card__label"><span class="sarmg-login__label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></span>账号</span><div class="sarmg-card__content"></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label"></span><div class="sarmg-card__content"><input id="adminUsername" class="sarmg-login__input" aria-label="账号" value="admin" autocomplete="username" required autofocus></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label"><span class="sarmg-login__label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>密码</span><div class="sarmg-card__content"></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label"></span><div class="sarmg-card__content"><input id="adminPassword" class="sarmg-login__input" aria-label="密码" type="password" autocomplete="current-password" required></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label"></span><div class="sarmg-card__content"><span id="loginError" class="sarmg-login__error" role="alert"></span></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label"><span class="sarmg-login__label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg></span>操作</span><div class="sarmg-card__content"><div class="sarmg-card__actions"><button id="loginButton" class="sarmg-card__action sarmg-action-primary" type="submit">登录</button></div></div></div>
      </div>
    </form>
  </main>

  <div id="app" class="app-shell sarmg-theme hidden" data-sarmg-scope data-sarmg-theme="light">
    <aside class="sidebar">
      <nav class="nav-list" aria-label="照片备份导航">
        <button class="nav-item active" type="button" onclick="showView('overview',this)" title="总览" aria-label="总览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>总览</span></button>
        <button class="nav-item" type="button" onclick="showView('usersView',this)" title="用户" aria-label="用户"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>用户</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="icon-button" type="button" onclick="loadOverview()" title="刷新全部数据" aria-label="刷新全部数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v6h-6"/><path d="M4 18v-6h6"/><path d="M18.36 9A9 9 0 0 0 5.64 5.64L4 7"/><path d="M6 15a9 9 0 0 0 12.36 3.36L20 17"/></svg></button>
        <div class="connection-pill" role="status" aria-label="服务连接已建立" title="服务连接已建立"><svg class="conn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <button class="icon-button" type="button" onclick="toggleTheme()" title="切换主题" aria-label="切换主题"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg></button>
        <button class="icon-button" type="button" onclick="logout()" title="退出登录" aria-label="退出登录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" x2="12" y1="2" y2="12"/></svg></button>
      </div>
    </aside>

    <main class="main">
      <section id="overview" class="view-stack">
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg><h2>备份</h2></div></header>
          <div class="sarmg-grid">
            <article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">用户</span><div class="sarmg-card__content"><strong id="mUsers" class="metric-row-value">0 / 0</strong></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">详情</span><div class="sarmg-card__content"><span class="metric-row-detail">启用 / 全部</span></div></div></div></article>
            <article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">已用</span><div class="sarmg-card__content"><strong id="mUsed" class="metric-row-value">0 B</strong></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">详情</span><div class="sarmg-card__content"><span class="metric-row-detail">加密数据</span></div></div></div></article>
            <article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">上传</span><div class="sarmg-card__content"><strong id="mPending" class="metric-row-value">0 B</strong></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">详情</span><div class="sarmg-card__content"><span class="metric-row-detail">预留空间</span></div></div></div></article>
            <article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">配额</span><div class="sarmg-card__content"><strong id="mQuota" class="metric-row-value">0 B</strong></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">详情</span><div class="sarmg-card__content"><span class="metric-row-detail">已分配</span></div></div></div></article>
          </div>
        </section>
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg><h2>用户概览</h2></div></header>
          <div id="overviewUsers" class="sarmg-grid"></div>
        </section>
      </section>

      <section id="usersView" class="view-stack hidden">
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg><h2>新增用户</h2></div></header>
          <div class="sarmg-grid"><form id="createForm" class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">账号</span><div class="sarmg-card__content"><input id="newUsername" class="card-input" minlength="3" maxlength="64" autocomplete="off" required></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">密码</span><div class="sarmg-card__content"><input id="newPassword" class="card-input" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">名称</span><div class="sarmg-card__content"><input id="newName" class="card-input" maxlength="100" required></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">路径</span><div class="sarmg-card__content"><input id="newPath" class="card-input" placeholder="自动分配"></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">配额</span><div class="sarmg-card__content"><input id="newQuota" class="card-input" type="number" min="0" step="1" value="100" required><span>GB</span></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">操作</span><div class="sarmg-card__content"><div class="sarmg-card__actions"><button class="sarmg-card__action sarmg-action-primary" type="submit">创建</button></div></div></div></div></form></div>
        </section>
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><h2>用户</h2></div></header>
          <div id="users" class="sarmg-grid"></div>
        </section>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const bytes=value=>{const n=Number(value||0);if(n>=1099511627776)return(n/1099511627776).toFixed(1)+' TB';if(n>=1073741824)return(n/1073741824).toFixed(1)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return n+' B'};
    const gb=value=>Number(value)===0?0:Math.round((Number(value)/1073741824)*100)/100;
    function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.display='none',2400)}
    function currentTheme(){try{return localStorage.getItem('photo-backup-theme')==='dark'?'dark':'light'}catch{return'light'}}
    function applyTheme(theme){$('loginWrap').dataset.sarmgTheme=theme;$('app').dataset.sarmgTheme=theme;try{localStorage.setItem('photo-backup-theme',theme)}catch{}document.documentElement.style.colorScheme=theme}
    function toggleTheme(){applyTheme($('app').dataset.sarmgTheme==='dark'?'light':'dark')}
    applyTheme(currentTheme());
    function showLogin(){$('loginWrap').classList.remove('hidden');$('app').classList.add('hidden')}
    function showView(id,button){$('overview').classList.toggle('hidden',id!=='overview');$('usersView').classList.toggle('hidden',id!=='usersView');document.querySelectorAll('.nav-item').forEach(item=>item.classList.remove('active'));button.classList.add('active')}
    let csrfToken='';
    async function api(path,options={},redirectOn401=true){const method=(options.method||'GET').toUpperCase();const mutation=!['GET','HEAD','OPTIONS','TRACE'].includes(method);const response=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(mutation&&csrfToken?{'X-CSRF-Token':csrfToken}:{}),...(options.headers||{})}});if(response.status===401&&redirectOn401){csrfToken='';showLogin();throw new Error('会话已过期')};const text=await response.text();if(!response.ok){if(response.status===401)throw new Error('账号或密码错误');let message=text;try{message=JSON.parse(text).error||text}catch{}throw new Error(message||('请求失败 '+response.status))}return text?JSON.parse(text):null}
    $('loginForm').addEventListener('input',()=>{$('loginButton').disabled=!$('adminUsername').value.trim()||!$('adminPassword').value});$('loginButton').disabled=true;
    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginError').textContent='';try{const session=await api('/admin/api/login',{method:'POST',body:JSON.stringify({username:$('adminUsername').value,password:$('adminPassword').value})},false);csrfToken=session.csrf_token;$('adminPassword').value='';$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');await loadOverview()}catch(error){$('loginError').textContent=error.message}});
    $('createForm').addEventListener('submit',async event=>{event.preventDefault();try{await api('/admin/api/users',{method:'POST',body:JSON.stringify({username:$('newUsername').value,password:$('newPassword').value,display_name:$('newName').value,storage_path:$('newPath').value,quota_bytes:Math.round(Number($('newQuota').value)*1073741824),enabled:true})});event.target.reset();$('newQuota').value='100';notify('用户已创建');await loadOverview()}catch(error){notify(error.message)}});
    function summaryCard(user){const ratio=user.quota_bytes>0?Math.min(100,user.used_bytes/user.quota_bytes*100):0;return `<article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">名称</span><div class="sarmg-card__content"><span class="sarmg-truncate sarmg-grow">${esc(user.display_name)}</span><i class="sarmg-status-led ${user.enabled?'sarmg-status-good':'sarmg-status-danger'}"></i></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">账号</span><div class="sarmg-card__content"><span class="sarmg-truncate">${esc(user.username)}</span></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">设备</span><div class="sarmg-card__content">${user.device_count}</div></div><div class="sarmg-card__row"><span class="sarmg-card__label">资源</span><div class="sarmg-card__content">${user.resource_count}</div></div><div class="sarmg-card__row"><span class="sarmg-card__label">占用</span><div class="sarmg-card__content"><div class="progress"><span style="width:${ratio}%"></span></div></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">容量</span><div class="sarmg-card__content"><span class="sarmg-truncate sarmg-muted">${bytes(user.used_bytes)} / ${user.quota_bytes===0?'不限':bytes(user.quota_bytes)}</span></div></div></div></article>`}
    function editCard(user){return `<article class="sarmg-card"><div class="sarmg-card__inner"><div class="sarmg-card__row"><span class="sarmg-card__label">名称</span><div class="sarmg-card__content"><input id="name-${user.id}" class="card-input" value="${esc(user.display_name)}"><i class="sarmg-status-led ${user.enabled?'sarmg-status-good':'sarmg-status-danger'}"></i></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">账号</span><div class="sarmg-card__content"><input id="username-${user.id}" class="card-input" value="${esc(user.username)}"></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">路径</span><div class="sarmg-card__content"><input id="path-${user.id}" class="card-input" value="${esc(user.storage_path)}"></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">配额</span><div class="sarmg-card__content"><input id="quota-${user.id}" class="card-input" type="number" min="0" step=".1" value="${gb(user.quota_bytes)}"><span>GB</span></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">密码</span><div class="sarmg-card__content"><input id="password-${user.id}" class="card-input" type="password" minlength="8" maxlength="128" placeholder="不修改"></div></div><div class="sarmg-card__row"><span class="sarmg-card__label">操作</span><div class="sarmg-card__content"><div class="sarmg-card__actions"><button class="sarmg-card__action sarmg-action-primary" type="button" onclick="saveUser('${user.id}')">保存</button><label class="card-check"><input id="enabled-${user.id}" type="checkbox" ${user.enabled?'checked':''}>启用</label></div></div></div></div></article>`}
    function renderUsers(users){$('overviewUsers').innerHTML=users.length?users.map(summaryCard).join(''):'<div class="empty-state">暂无用户</div>';$('users').innerHTML=users.length?users.map(editCard).join(''):'<div class="empty-state">暂无用户</div>'}
    async function loadOverview(){try{const data=await api('/admin/api/overview');$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');$('mUsers').textContent=data.active_users+' / '+data.total_users;$('mUsed').textContent=bytes(data.used_bytes);$('mPending').textContent=bytes(data.pending_bytes);$('mQuota').textContent=data.unlimited_users?bytes(data.quota_bytes)+' + 不限':bytes(data.quota_bytes);renderUsers(data.users)}catch(error){if(error.message!=='会话已过期')notify(error.message)}}
    async function saveUser(id){try{await api('/admin/api/users/'+id,{method:'PUT',body:JSON.stringify({username:$('username-'+id).value,display_name:$('name-'+id).value,storage_path:$('path-'+id).value,quota_bytes:Math.round(Number($('quota-'+id).value)*1073741824),enabled:$('enabled-'+id).checked})});const password=$('password-'+id).value;if(password)await api('/admin/api/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({password})});notify('已保存');await loadOverview()}catch(error){notify(error.message)}}
    async function logout(){try{await api('/admin/api/logout',{method:'POST',body:'{}'})}finally{csrfToken='';showLogin()}}
    (async()=>{try{const session=await api('/admin/api/session');csrfToken=session.csrf_token;await loadOverview()}catch(error){if(error.message!=='会话已过期')showLogin()}})();
  </script>
</body>
</html>
