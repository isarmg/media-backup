<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>照片备份</title>
  <style>
    @font-face{font-family:"ProjectSourceHanSans";src:local("Source Han Sans SC"),local("Source Han Sans CN"),local("Noto Sans CJK SC"),local("思源黑体");font-weight:200 900;font-style:normal;font-display:swap}
    :root{--font-sans:"ProjectSourceHanSans","思源柔体","Source Han Sans SC","Source Han Sans CN","Noto Sans CJK SC","HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;font-family:var(--font-sans);font-size:16px;line-height:1.5;color:#202a33;background:#f5f6f3;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}html{text-size-adjust:100%}body{margin:0;min-width:320px;min-height:100vh;font-family:var(--font-sans);line-height:1.5;overflow-wrap:anywhere}button,input{font:inherit;line-height:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}h1,h2,h3,p{margin:0}.hidden{display:none!important}
    .app-shell{--content-block-gap:16px;--theme-block-gap:calc(var(--content-block-gap)*2);--theme-title-size:calc(var(--content-block-gap)*4/3);--bg:#f5f6f3;--surface:#fff;--surface-strong:#fafbf8;--border:#d9dfd5;--text:#202a33;--muted:#60707c;--subtle:#87929a;--primary:#245b75;--primary-strong:#164154;--danger:#a73d46;--danger-soft:#fae8e9;--good:#24745b;--good-soft:#e6f3ea;--warn:#a66a17;--warn-soft:#fff1d7;--accent:#6f4a8e;--radius-control:14px;--radius-card:20px;--radius-panel:26px;--radius:var(--radius-control);--shadow:0 20px 60px rgb(51 66 75/.1);--card-width:calc((100vw - 144px)/6);display:flex;flex-direction:column;gap:16px;min-height:100vh;padding:16px;color:var(--text);background:var(--bg)}
    .app-shell[data-theme="dark"]{--bg:#151a1d;--surface:#20262a;--surface-strong:#252c31;--border:#354047;--text:#edf2f4;--muted:#a4b0b7;--subtle:#7e8b94;--primary:#5fa8c8;--primary-strong:#9bd2e6;--danger:#ff8a92;--danger-soft:#44292d;--good:#76d1a5;--good-soft:#1e3b31;--warn:#f0b761;--warn-soft:#47351e;--accent:#c6a5e4;--shadow:0 20px 60px rgb(0 0 0/.32)}
    .sidebar{--nav-control-height:36px;--nav-icon-size:18px;position:sticky;top:16px;z-index:10;display:flex;flex-direction:row;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--surface-strong);box-shadow:var(--shadow)}
    .nav-list{display:flex;flex-direction:row;flex:1;gap:4px}.nav-item,.icon-button{border:1px solid transparent;border-radius:var(--radius)}.nav-item{position:relative;display:inline-flex;align-items:center;gap:6px;min-width:0;height:var(--nav-control-height);min-height:var(--nav-control-height);padding:0 10px;color:var(--muted);background:transparent;border:none;border-radius:0;text-align:left;line-height:1.25;white-space:nowrap}.nav-item svg{flex:0 0 auto;width:var(--nav-icon-size);height:var(--nav-icon-size)}.nav-item span{min-width:0;white-space:nowrap;font-size:13px}.nav-item:hover,.nav-item.active{color:var(--text);background:transparent}.sidebar-footer{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}.connection-pill{display:inline-flex;align-items:center;justify-content:center;width:34px;height:var(--nav-control-height);background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-control)}.icon-button{display:inline-grid;place-items:center;width:36px;height:36px;color:var(--text);background:var(--surface);border-color:var(--border)}.icon-button:hover{border-color:var(--primary)}.icon-button svg{width:18px;height:18px}.conn-icon{width:14px;height:14px;color:var(--good)}
    .main{min-width:0;min-height:0;padding:16px;display:flex;flex-direction:column}.main>.view-stack{flex:1;min-height:0;align-content:start}.view-stack{display:grid;gap:var(--theme-block-gap)}
    .section-band{min-width:0}.section-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--content-block-gap);min-width:0;margin-bottom:var(--content-block-gap)}.section-title{display:flex;align-items:flex-start;gap:8px;min-width:0}.section-title svg{flex:0 0 var(--theme-title-size);width:var(--theme-title-size);height:var(--theme-title-size);margin:0;color:var(--primary)}.section-title h2{height:var(--theme-title-size);font-size:var(--theme-title-size);line-height:var(--theme-title-size)}
    .content-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--content-block-gap)}.content-card{--content-card-radius-x:5.5556%;--content-card-radius-y:8.3333%;--content-card-row-height:calc(100cqh/6);--content-card-font-size:calc(var(--content-card-row-height)*.5);--content-card-glyph-half:calc(var(--content-card-font-size)*.5);--content-card-text-start:calc(var(--content-card-radius-x) - var(--content-card-glyph-half));position:relative;container-type:size;aspect-ratio:3/2;overflow:hidden;background:var(--surface-strong);border:none;border-radius:var(--content-card-radius-x)/var(--content-card-radius-y)}
    .card-inner{position:absolute;inset:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-rows:0;gap:0;padding-inline-start:var(--content-card-text-start);padding-inline-end:var(--content-card-text-start);min-width:0;min-height:0;font-size:var(--content-card-font-size);line-height:1.2}.card-row{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:2ch;align-items:center;min-width:0;overflow:hidden}.card-row-label{display:inline-flex;align-items:center;flex-shrink:0;gap:3px;color:var(--muted);white-space:nowrap}.card-row-content{display:flex;align-items:center;min-width:0;overflow:hidden;gap:4px}.card-row:first-child,.card-row:first-child>.card-row-content{overflow:visible}.card-row:first-child .card-row-content>.status-led{margin-inline-end:calc(var(--content-card-glyph-half) - .4em)}.content-card,.content-card strong,.content-card b,.content-card .metric-row-value,.content-card .card-action-button{font-weight:400}.truncate-text{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.truncate-text.grow{flex:1}.muted-text,.metric-row-detail{color:var(--muted)}.metric-row-value,.metric-row-detail{line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-led{display:inline-block;width:.8em;height:.8em;border-radius:50%;flex-shrink:0;vertical-align:middle;margin-left:auto}.status-led.good{background:var(--good)}.status-led.warn{background:var(--warn)}.status-led.danger{background:var(--danger)}
    .card-actions{display:flex;align-items:center;flex-wrap:wrap;width:100%;gap:.5em}.card-action-button{min-width:0;min-height:0;padding:0;gap:0;color:var(--text);background:transparent;border:none;border-radius:0}.card-action-button:hover{color:var(--primary)}.card-action-button.primary{color:var(--primary)}.card-action-button.danger{color:var(--danger)}
    .card-input{width:100%;min-width:0;padding:0;color:var(--text);background:transparent;border:0;border-bottom:1px solid transparent;outline:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-input:focus{border-bottom-color:var(--primary)}.card-input[type="number"]{appearance:textfield}.card-input::-webkit-inner-spin-button{appearance:none}.card-check{display:inline-flex;align-items:center;gap:.4em;color:var(--muted);white-space:nowrap}.card-check input{width:1em;height:1em;margin:0;accent-color:var(--primary)}
    .progress{width:100%;height:8px;overflow:hidden;background:var(--border);border-radius:999px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--good))}.empty-state{grid-column:1/-1;display:grid;place-items:center;min-height:160px;color:var(--muted)}
    .login-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px;background:var(--bg);color:var(--text)}.login-card{width:min(380px,100%);flex:0 0 auto;color:var(--text)}.login-card .login-input{width:100%;min-width:0;padding:0;color:var(--text);background:transparent;border:0;border-bottom:1px solid transparent;outline:0}.login-card .card-row:has(.login-input),.login-card .card-inner>.card-row:nth-child(5){grid-template-columns:minmax(0,1fr);column-gap:0}.login-card .card-row:has(.login-input)>.card-row-label,.login-card .card-inner>.card-row:nth-child(5)>.card-row-label{display:none}.login-card .login-label-icon{display:inline-grid;place-items:center;width:1em;height:1em;border:1px solid currentColor;border-radius:.25em;flex:0 0 1em}.login-card .card-row-label:has(.login-label-icon){gap:1ch}.login-card .login-label-icon svg{width:.65em;height:.65em;stroke-width:1.75}.login-card .login-input:focus{border-bottom-color:var(--primary)}.login-card .login-error{min-width:0;overflow:hidden;color:var(--danger);text-overflow:ellipsis;white-space:nowrap}.login-card .card-actions{display:grid;grid-template-columns:1fr}.toast{position:fixed;right:18px;bottom:18px;z-index:30;padding:10px 12px;color:var(--text);background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:none}
    @media(max-width:1080px){.nav-item span{display:none}.nav-item{padding:0 8px}.content-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:960px){.content-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){.app-shell{gap:12px;padding:12px}.sidebar{position:static;flex-wrap:wrap;padding:6px 10px;gap:6px}.nav-list{flex-wrap:wrap}.nav-item span{display:inline}.nav-item{padding:4px 8px;gap:4px;font-size:13px}.main{padding:12px 8px}.section-header{display:grid}}
    @media(max-width:640px){.content-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:480px){.content-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="loginWrap" class="app-shell login-screen" data-theme="light">
    <form id="loginForm" class="content-card login-card" aria-label="登录照片备份管理中心">
      <div class="card-inner">
        <div class="card-row"><span class="card-row-label"><span class="login-label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></span>账号</span><div class="card-row-content"></div></div>
        <div class="card-row"><span class="card-row-label"></span><div class="card-row-content"><input id="adminUsername" class="login-input" aria-label="账号" value="admin" autocomplete="username" required autofocus></div></div>
        <div class="card-row"><span class="card-row-label"><span class="login-label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>密码</span><div class="card-row-content"></div></div>
        <div class="card-row"><span class="card-row-label"></span><div class="card-row-content"><input id="adminPassword" class="login-input" aria-label="密码" type="password" autocomplete="current-password" required></div></div>
        <div class="card-row"><span class="card-row-label"></span><div class="card-row-content"><span id="loginError" class="login-error" role="alert"></span></div></div>
        <div class="card-row"><span class="card-row-label"><span class="login-label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg></span>操作</span><div class="card-row-content"><div class="card-actions"><button id="loginButton" class="card-action-button primary" type="submit">登录</button></div></div></div>
      </div>
    </form>
  </main>

  <div id="app" class="app-shell hidden" data-theme="light">
    <aside class="sidebar">
      <nav class="nav-list" aria-label="照片备份导航">
        <button class="nav-item active" type="button" onclick="showView('overview',this)" title="总览" aria-label="总览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>总览</span></button>
        <button class="nav-item" type="button" onclick="showView('usersView',this)" title="用户" aria-label="用户"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>用户</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="icon-button" type="button" onclick="loadOverview()" title="刷新全部数据" aria-label="刷新全部数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v6h-6"/><path d="M4 18v-6h6"/><path d="M18.36 9A9 9 0 0 0 5.64 5.64L4 7"/><path d="M6 15a9 9 0 0 0 12.36 3.36L20 17"/></svg></button>
        <div class="connection-pill" role="status" aria-label="服务连接已建立" title="服务连接已建立"><svg class="conn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <button class="icon-button" type="button" onclick="toggleTheme()" title="切换主题" aria-label="切换主题"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg></button>
        <button class="icon-button" type="button" onclick="logout()" title="退出登录" aria-label="退出登录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" x2="12" y1="2" y2="12"/></svg></button>
      </div>
    </aside>

    <main class="main">
      <section id="overview" class="view-stack">
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg><h2>备份</h2></div></header>
          <div class="content-grid">
            <article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">用户</span><div class="card-row-content"><strong id="mUsers" class="metric-row-value">0 / 0</strong></div></div><div class="card-row"><span class="card-row-label">详情</span><div class="card-row-content"><span class="metric-row-detail">启用 / 全部</span></div></div></div></article>
            <article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">已用</span><div class="card-row-content"><strong id="mUsed" class="metric-row-value">0 B</strong></div></div><div class="card-row"><span class="card-row-label">详情</span><div class="card-row-content"><span class="metric-row-detail">加密数据</span></div></div></div></article>
            <article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">上传</span><div class="card-row-content"><strong id="mPending" class="metric-row-value">0 B</strong></div></div><div class="card-row"><span class="card-row-label">详情</span><div class="card-row-content"><span class="metric-row-detail">预留空间</span></div></div></div></article>
            <article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">配额</span><div class="card-row-content"><strong id="mQuota" class="metric-row-value">0 B</strong></div></div><div class="card-row"><span class="card-row-label">详情</span><div class="card-row-content"><span class="metric-row-detail">已分配</span></div></div></div></article>
          </div>
        </section>
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg><h2>用户概览</h2></div></header>
          <div id="overviewUsers" class="content-grid"></div>
        </section>
      </section>

      <section id="usersView" class="view-stack hidden">
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg><h2>新增用户</h2></div></header>
          <div class="content-grid"><form id="createForm" class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">账号</span><div class="card-row-content"><input id="newUsername" class="card-input" minlength="3" maxlength="64" autocomplete="off" required></div></div><div class="card-row"><span class="card-row-label">密码</span><div class="card-row-content"><input id="newPassword" class="card-input" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div></div><div class="card-row"><span class="card-row-label">名称</span><div class="card-row-content"><input id="newName" class="card-input" maxlength="100" required></div></div><div class="card-row"><span class="card-row-label">路径</span><div class="card-row-content"><input id="newPath" class="card-input" placeholder="自动分配"></div></div><div class="card-row"><span class="card-row-label">配额</span><div class="card-row-content"><input id="newQuota" class="card-input" type="number" min="0" step="1" value="100" required><span>GB</span></div></div><div class="card-row"><span class="card-row-label">操作</span><div class="card-row-content"><div class="card-actions"><button class="card-action-button primary" type="submit">创建</button></div></div></div></div></form></div>
        </section>
        <section class="section-band">
          <header class="section-header"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><h2>用户</h2></div></header>
          <div id="users" class="content-grid"></div>
        </section>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const bytes=value=>{const n=Number(value||0);if(n>=1099511627776)return(n/1099511627776).toFixed(1)+' TB';if(n>=1073741824)return(n/1073741824).toFixed(1)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return n+' B'};
    const gb=value=>Number(value)===0?0:Math.round((Number(value)/1073741824)*100)/100;
    function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.display='none',2400)}
    function currentTheme(){try{return localStorage.getItem('photo-backup-theme')==='dark'?'dark':'light'}catch{return'light'}}
    function applyTheme(theme){$('loginWrap').dataset.theme=theme;$('app').dataset.theme=theme;try{localStorage.setItem('photo-backup-theme',theme)}catch{}document.documentElement.style.colorScheme=theme}
    function toggleTheme(){applyTheme($('app').dataset.theme==='dark'?'light':'dark')}
    applyTheme(currentTheme());
    function showLogin(){$('loginWrap').classList.remove('hidden');$('app').classList.add('hidden')}
    function showView(id,button){$('overview').classList.toggle('hidden',id!=='overview');$('usersView').classList.toggle('hidden',id!=='usersView');document.querySelectorAll('.nav-item').forEach(item=>item.classList.remove('active'));button.classList.add('active')}
    async function api(path,options={},redirectOn401=true){const response=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(response.status===401&&redirectOn401){showLogin();throw new Error('会话已过期')};const text=await response.text();if(!response.ok){if(response.status===401)throw new Error('账号或密码错误');let message=text;try{message=JSON.parse(text).error||text}catch{}throw new Error(message||('请求失败 '+response.status))}return text?JSON.parse(text):null}
    $('loginForm').addEventListener('input',()=>{$('loginButton').disabled=!$('adminUsername').value.trim()||!$('adminPassword').value});$('loginButton').disabled=true;
    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginError').textContent='';try{await api('/admin/api/login',{method:'POST',body:JSON.stringify({username:$('adminUsername').value,password:$('adminPassword').value})},false);$('adminPassword').value='';$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');await loadOverview()}catch(error){$('loginError').textContent=error.message}});
    $('createForm').addEventListener('submit',async event=>{event.preventDefault();try{await api('/admin/api/users',{method:'POST',body:JSON.stringify({username:$('newUsername').value,password:$('newPassword').value,display_name:$('newName').value,storage_path:$('newPath').value,quota_bytes:Math.round(Number($('newQuota').value)*1073741824),enabled:true})});event.target.reset();$('newQuota').value='100';notify('用户已创建');await loadOverview()}catch(error){notify(error.message)}});
    function summaryCard(user){const ratio=user.quota_bytes>0?Math.min(100,user.used_bytes/user.quota_bytes*100):0;return `<article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">名称</span><div class="card-row-content"><span class="truncate-text grow">${esc(user.display_name)}</span><i class="status-led ${user.enabled?'good':'danger'}"></i></div></div><div class="card-row"><span class="card-row-label">账号</span><div class="card-row-content"><span class="truncate-text">${esc(user.username)}</span></div></div><div class="card-row"><span class="card-row-label">设备</span><div class="card-row-content">${user.device_count}</div></div><div class="card-row"><span class="card-row-label">资源</span><div class="card-row-content">${user.resource_count}</div></div><div class="card-row"><span class="card-row-label">占用</span><div class="card-row-content"><div class="progress"><span style="width:${ratio}%"></span></div></div></div><div class="card-row"><span class="card-row-label">容量</span><div class="card-row-content"><span class="truncate-text muted-text">${bytes(user.used_bytes)} / ${user.quota_bytes===0?'不限':bytes(user.quota_bytes)}</span></div></div></div></article>`}
    function editCard(user){return `<article class="content-card"><div class="card-inner"><div class="card-row"><span class="card-row-label">名称</span><div class="card-row-content"><input id="name-${user.id}" class="card-input" value="${esc(user.display_name)}"><i class="status-led ${user.enabled?'good':'danger'}"></i></div></div><div class="card-row"><span class="card-row-label">账号</span><div class="card-row-content"><input id="username-${user.id}" class="card-input" value="${esc(user.username)}"></div></div><div class="card-row"><span class="card-row-label">路径</span><div class="card-row-content"><input id="path-${user.id}" class="card-input" value="${esc(user.storage_path)}"></div></div><div class="card-row"><span class="card-row-label">配额</span><div class="card-row-content"><input id="quota-${user.id}" class="card-input" type="number" min="0" step=".1" value="${gb(user.quota_bytes)}"><span>GB</span></div></div><div class="card-row"><span class="card-row-label">密码</span><div class="card-row-content"><input id="password-${user.id}" class="card-input" type="password" minlength="8" maxlength="128" placeholder="不修改"></div></div><div class="card-row"><span class="card-row-label">操作</span><div class="card-row-content"><div class="card-actions"><button class="card-action-button primary" type="button" onclick="saveUser('${user.id}')">保存</button><label class="card-check"><input id="enabled-${user.id}" type="checkbox" ${user.enabled?'checked':''}>启用</label></div></div></div></div></article>`}
    function renderUsers(users){$('overviewUsers').innerHTML=users.length?users.map(summaryCard).join(''):'<div class="empty-state">暂无用户</div>';$('users').innerHTML=users.length?users.map(editCard).join(''):'<div class="empty-state">暂无用户</div>'}
    async function loadOverview(){try{const data=await api('/admin/api/overview');$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');$('mUsers').textContent=data.active_users+' / '+data.total_users;$('mUsed').textContent=bytes(data.used_bytes);$('mPending').textContent=bytes(data.pending_bytes);$('mQuota').textContent=data.unlimited_users?bytes(data.quota_bytes)+' + 不限':bytes(data.quota_bytes);renderUsers(data.users)}catch(error){if(error.message!=='会话已过期')notify(error.message)}}
    async function saveUser(id){try{await api('/admin/api/users/'+id,{method:'PUT',body:JSON.stringify({username:$('username-'+id).value,display_name:$('name-'+id).value,storage_path:$('path-'+id).value,quota_bytes:Math.round(Number($('quota-'+id).value)*1073741824),enabled:$('enabled-'+id).checked})});const password=$('password-'+id).value;if(password)await api('/admin/api/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({password})});notify('已保存');await loadOverview()}catch(error){notify(error.message)}}
    async function logout(){try{await api('/admin/api/logout',{method:'POST',body:'{}'})}finally{showLogin()}}
    loadOverview();
  </script>
</body>
</html>
