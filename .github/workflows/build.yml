name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci --prefix clients/web
      - run: npm run build --prefix clients/web
      - name: Install browser acceptance engines
        working-directory: clients/web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify current administrator and backup Web flows
        working-directory: clients/web
        run: node tests/browser-acceptance.mjs
      - run: ./scripts/check-mobile-v02-contract.sh
      - run: ./scripts/check-workflow-supply-chain.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash scripts/test-mobile-ffi-c.sh
      - name: Build and test the real server release archive
        run: |
          revision="$(git rev-parse HEAD)"
          MEDIA_BACKUP_SOURCE_REVISION="$revision" cargo build --release --locked -p media-backup-server --target x86_64-unknown-linux-gnu
          mkdir -p "$PWD/dist"
          archive="$(./scripts/build-server-release.sh "$PWD/target/x86_64-unknown-linux-gnu/release/media-backup-server" "$revision" "$PWD/dist")"
          MEDIA_BACKUP_VERIFY_SYSTEMD=1 ./scripts/test-deployment.sh "$archive"

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify actual JNI exceptions and current ABI on the host JVM
        run: bash scripts/test-mobile-ffi-jni.sh
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o clients/android/app/src/main/jniLibs build -p media-backup-mobile --release
      - run: gradle -p clients/android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-backup-android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS unsigned build
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
      - run: brew install xcodegen
      - run: ./scripts/build-ios-rust.sh
      - run: cd clients/ios && xcodegen generate
      - name: Run iOS state-epoch isolation tests
        run: |
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$simulator_udid"
          xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphonesimulator -destination "id=$simulator_udid" CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData test
      - name: Build without signing
        run: xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-backup-ios-unsigned
          path: clients/ios/DerivedData/Build/Products/Release-iphoneos/MediaBackup.app
