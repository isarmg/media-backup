name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: PHOTO_BACKUP_VERIFY_SYSTEMD=1 ./scripts/test-deployment.sh
      - run: cargo test --workspace --locked

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p photo-backup-mobile --release
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photo-backup-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS unsigned build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: brew install xcodegen
      - run: ./scripts/build-ios-rust.sh
      - run: cd ios && xcodegen generate
      - name: Build without signing
        run: xcodebuild -project ios/PhotoBackup.xcodeproj -scheme PhotoBackup -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/DerivedData build
      - uses: actions/upload-artifact@v4
        with:
          name: photo-backup-ios-unsigned
          path: ios/DerivedData/Build/Products/Release-iphoneos/PhotoBackup.app
