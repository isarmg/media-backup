name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/verify-release-version.sh "$RELEASE_TAG"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  server:
    name: Linux server
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-server
      - run: cargo build --release --locked -p photo-backup-server
      - name: Package server
        run: |
          version="${RELEASE_TAG#v}"
          package="photo-backup-server-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          cp target/release/photo-backup-server .env.example README.md "dist/$package/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          rm -rf "dist/$package"
      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p photo-backup-mobile --release
      - run: gradle -p android assembleDebug
      - name: Package APK
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/photo-backup-android-${version}-arm64-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned app
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ios
      - run: brew install xcodegen
      - run: ./scripts/build-ios-rust.sh
      - run: cd ios && xcodegen generate
      - name: Build without signing
        run: xcodebuild -project ios/PhotoBackup.xcodeproj -scheme PhotoBackup -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/DerivedData build
      - name: Package app
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          tar -C ios/DerivedData/Build/Products/Release-iphoneos -czf "dist/photo-backup-ios-${version}-unsigned.tar.gz" PhotoBackup.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [server, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
