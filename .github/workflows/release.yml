name: Release

on:
  push:
    tags:
      - "v0.2.1"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to publish (must be v0.2.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  MEDIA_BACKUP_ANDROID_APPLICATION_ID: org.sarmg.mediabackup
  MEDIA_BACKUP_ANDROID_SIGNING_KEY_ALIAS: media-backup-android-release
  MEDIA_BACKUP_ANDROID_SIGNING_CERT_SHA256: 0cfc2811d48cdeab3e6d857029d879e001ab9531c06784b4d48d15a847771421

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci --prefix clients/web
      - run: npm run build --prefix clients/web
      - run: ./scripts/verify-release-version.sh "$RELEASE_TAG"
      - run: ./scripts/check-mobile-v02-contract.sh
      - run: ./scripts/check-workflow-supply-chain.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    name: Linux server
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-server
      - run: npm ci --prefix clients/web
      - run: npm run build --prefix clients/web
      - name: Build, package, and verify server
        run: |
          revision="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          MEDIA_BACKUP_SOURCE_REVISION="$revision" cargo build --release --locked -p media-backup-server --target x86_64-unknown-linux-gnu
          mkdir -p "$PWD/dist"
          archive="$(./scripts/build-server-release.sh "$PWD/target/x86_64-unknown-linux-gnu/release/media-backup-server" "$revision" "$PWD/dist")"
          MEDIA_BACKUP_VERIFY_SYSTEMD=1 ./scripts/test-deployment.sh "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    needs: validate
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o clients/android/app/src/main/jniLibs build -p media-backup-mobile --release
      - name: Materialize and validate the current signing identity
        env:
          MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_BASE64: ${{ secrets.MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_BASE64 }}
          MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD: ${{ secrets.MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD }}
        run: |
          test -n "$MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_BASE64"
          test -n "$MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD"
          umask 077
          printf '%s' "$MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_BASE64" \
            | base64 --decode >"$RUNNER_TEMP/media-backup-android-release.p12"
          test -s "$RUNNER_TEMP/media-backup-android-release.p12"
          alias_line="$(
            openssl pkcs12 \
              -in "$RUNNER_TEMP/media-backup-android-release.p12" \
              -passin env:MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD \
              -clcerts -nokeys \
              | sed -n 's/^    friendlyName: //p'
          )"
          test "$alias_line" = "$MEDIA_BACKUP_ANDROID_SIGNING_KEY_ALIAS"
      - name: Build the signed release APK
        env:
          MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PATH: ${{ runner.temp }}/media-backup-android-release.p12
          MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD: ${{ secrets.MEDIA_BACKUP_ANDROID_SIGNING_PKCS12_PASSWORD }}
        run: gradle -p clients/android assembleRelease
      - name: Verify and package the signed APK
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk="clients/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          signer_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          test "$(printf '%s\n' "$signer_output" | grep -c '^Signer #[0-9].*certificate SHA-256 digest:')" -eq 1
          actual_fingerprint="$(
            printf '%s\n' "$signer_output" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          test "${actual_fingerprint,,}" = "$MEDIA_BACKUP_ANDROID_SIGNING_CERT_SHA256"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='$MEDIA_BACKUP_ANDROID_APPLICATION_ID'"
          test "$(zipinfo -1 "$apk" | awk -F/ '$1 == "lib" { print $2 }' | sort -u)" = "arm64-v8a"
          zipinfo -1 "$apk" | grep -Fx 'lib/arm64-v8a/libmedia_backup_mobile.so'
          mkdir -p dist
          install -m 0444 "$apk" "dist/media-backup-android-${version}-arm64.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned app
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-ios
      - run: brew install xcodegen
      - run: ./scripts/build-ios-rust.sh
      - run: cd clients/ios && xcodegen generate
      - name: Build without signing
        run: xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData build
      - name: Package app
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          tar -C clients/ios/DerivedData/Build/Products/Release-iphoneos -czf "dist/media-backup-ios-${version}-unsigned.tar.gz" MediaBackup.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ios
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [server, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse or overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file docs/releases/0.2.1.md --title "$RELEASE_TAG"
