name: PhotoBackup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoBackup:
    type: application
    platform: iOS
    sources:
      - PhotoBackup
    info:
      path: PhotoBackup/Info.plist
      properties:
        CFBundleDisplayName: 照片备份
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 用于读取您选择的照片和视频，并通过 HTTPS 备份到自己的服务器。
        NSPhotoLibraryAddUsageDescription: 用于将您从服务器恢复的原始照片和视频写回系统照片库。
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.photobackup.v02.processing.v0-2-r1
    entitlements:
      path: PhotoBackup/PhotoBackup.entitlements
    dependencies:
      - framework: Vendor/PhotoBackupRust.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.v02
        PRODUCT_NAME: PhotoBackup
        CODE_SIGN_STYLE: Automatic
  PhotoBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoBackupTests
    dependencies:
      - target: PhotoBackup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.v02.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  PhotoBackup:
    build:
      targets:
        PhotoBackup: all
    test:
      config: Debug
      targets:
        - PhotoBackupTests
