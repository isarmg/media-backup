name: PhotoBackup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoBackup:
    type: application
    platform: iOS
    sources:
      - PhotoBackup
    info:
      path: PhotoBackup/Info.plist
    entitlements:
      path: PhotoBackup/PhotoBackup.entitlements
    dependencies:
      - framework: Vendor/PhotoBackupRust.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.v02
        PRODUCT_NAME: PhotoBackup
        CODE_SIGN_STYLE: Automatic
  PhotoBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoBackupTests
    dependencies:
      - target: PhotoBackup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.v02.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  PhotoBackup:
    build:
      targets:
        PhotoBackup: all
    test:
      config: Debug
      targets:
        - PhotoBackupTests
